# ═══════════════════════════════════════════════════════════════════════════════
# 五、反模式 —— 不应替换的惯用表达 (Negative Patterns)
# ═══════════════════════════════════════════════════════════════════════════════
# 这些表达虽然在形式上看起来是口语，但在技术语境中已是约定俗成的惯用表达，
# 替换反而会降低可读性和检索效果。术语对齐阶段应跳过这些模式。

negative_patterns:
  - pattern: "hello world"
    reason: "编程入门示例的约定俗成表达"
    example: "\"写个 hello world\" — 不应替换为 \"编写一个问候世界的程序\""

  - pattern: "bug"
    reason: "软件开发中约定俗成的缺陷描述，不需替换为\"软件缺陷\""
    example: "\"修 bug\" — 保持原样"

  - pattern: "debug"
    reason: "已是正式术语，不需替换为\"排除故障\""
    example: "\"debug 一下\" — 去除冗余语气词即可"

  - pattern: "fix"
    reason: "版本控制/开发中的约定俗成表达"
    example: "\"fix 这个 issue\" — 保持原样"

  - pattern: "hotfix"
    reason: "已是正式术语"
    example: "\"打个 hotfix\" — 去除冗余词即可"

  - pattern: "patch"
    reason: "已是正式术语"
    example: "\"应用 patch\" — 保持原样"

  - pattern: "commit"
    reason: "Git 的标准术语"
    example: "\"提交一个 commit\" — 保持原样"

  - pattern: "pull request"
    reason: "GitHub/GitLab 的标准术语"
    example: "\"提个 PR\" — \"PR\" 展开为 \"Pull Request\" 即可"

  - pattern: "搞快点"
    reason: "明确的性能优化意图，不应替换为模糊的\"尽快完成\""
    example: "\"查询搞快点\" 应理解为 \"优化查询性能 / 降低查询延迟\""

  - pattern: "调通"
    reason: "技术调试的约定俗成表达，替换为\"调试使其正常运行\"损失信息密度"
    example: "\"接口调通了\" — 可保持或替换为 \"接口调试成功\""
