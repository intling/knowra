# ============================================================================
# knowra — 术语对齐表 (Term Alignment Table)
# ============================================================================
# 将用户查询中的口语化、非正式表达映射为正式专业术语，
# 确保改写后的查询用词与知识库文档中的正式术语一致。
#
# 用途：
#   - 术语对齐阶段（TermAlignRewriter）——查询重写时进行术语替换
#   - 质量评估阶段（Postprocessor）——检查改写结果的术语准确性
#   - Prompt 构建阶段——可作为 few-shot 示例注入模板
#
# 对齐表结构：
#   - general_alignments:   通用口语→正式语映射（跨领域通用）
#   - domain_alignments:    按领域分类的专业术语对齐
#   - technical_alignments: 技术口语→标准术语映射
#   - alias_to_canonical:   别名/俗称→标准写法（多对一归并）
#   - negative_patterns:    反模式——不应替换的惯用表达（防止过度规范化）
#
# 术语对齐原则：
#   1. 优先与知识库中的正式术语对齐（知识库用词优先）
#   2. 保留用户未提及的领域信息（不引入新概念）
#   3. 英文专业术语保留原样，不强行翻译（API、SDK、CI/CD 等）
#   4. 不改变查询语义意图（对齐 = 标准化，≠ 改写意图）
#
# 版本规范：遵循 SemVer (MAJOR.MINOR.PATCH)
# ============================================================================

version: "1.0.0"
description: >-
  术语对齐表 —— 将用户口语化、非正式表达映射为正式专业术语，
  确保改写结果与知识库文档用词一致，提升检索命中率。

# ═══════════════════════════════════════════════════════════════════════════════
# 一、通用口语 → 正式语映射 (General Alignments)
# ═══════════════════════════════════════════════════════════════════════════════
# 跨领域通用的口语→书面语映射，适用于所有查询场景。

general_alignments:
  # ── 操作类 ──
  - colloquial: "跑"
    formal: "运行"
    note: "\"跑程序\" → \"运行程序\""

  - colloquial: "跑起来"
    formal: "启动运行"
    note: "\"让服务跑起来\" → \"启动运行服务\""

  - colloquial: "装"
    formal: "安装"
    note: "\"装一个库\" → \"安装一个库\""

  - colloquial: "搭"
    formal: "搭建 / 构建"
    note: "\"搭个环境\" → \"搭建环境\""

  - colloquial: "搞"
    formal: "实现 / 处理 / 配置"
    note: "根据上下文选择：\"搞个接口\"→\"实现接口\"，\"搞不定\"→\"无法处理\""

  - colloquial: "弄"
    formal: "处理 / 操作 / 设置"
    note: "\"弄一下配置\" → \"修改配置\""

  - colloquial: "写"
    formal: "编写 / 实现"
    note: "\"写个脚本\" → \"编写脚本\"，\"写代码\"保持原样（已成标准表达）"

  - colloquial: "改"
    formal: "修改 / 调整"
    note: "\"改一下参数\" → \"调整参数\""

  - colloquial: "删"
    formal: "删除"
    note: "保持原样已足够正式，可补充宾语"

  - colloquial: "查"
    formal: "查询 / 检索 / 查找"
    note: "\"查一下文档\" → \"检索文档\""

  - colloquial: "看"
    formal: "查看 / 检查"
    note: "\"看一下日志\" → \"查看日志\""

  - colloquial: "测"
    formal: "测试 / 验证"
    note: "\"测一下接口\" → \"测试接口\""

  - colloquial: "调"
    formal: "调试 / 调用 / 调整"
    note: "多义：\"调bug\"→\"调试\"，\"调接口\"→\"调用\"，\"调参数\"→\"调整\""

  - colloquial: "配"
    formal: "配置"
    note: "\"配一下环境变量\" → \"配置环境变量\""

  # ── 状态描述 ──
  - colloquial: "挂了"
    formal: "崩溃 / 停止响应 / 宕机"
    note: "\"服务挂了\" → \"服务停止响应\""

  - colloquial: "崩了"
    formal: "崩溃 / 异常终止"
    note: "\"程序崩了\" → \"程序异常终止\""

  - colloquial: "卡了"
    formal: "响应缓慢 / 卡顿 / 阻塞"
    note: "\"界面卡了\" → \"界面响应缓慢\""

  - colloquial: "凉了"
    formal: "失效 / 不可用"
    note: "\"这个方法凉了\" → \"该方法已废弃/不可用\""

  - colloquial: "炸了"
    formal: "严重故障 / 不可用"
    note: "\"服务器炸了\" → \"服务器发生严重故障\""

  - colloquial: "出问题了"
    formal: "出现异常 / 发生错误"
    note: "通用故障描述，根据上下文选择更精确的表达"

  - colloquial: "不对"
    formal: "不正确 / 不符合预期"
    note: "\"结果不对\" → \"结果不符合预期\""

  - colloquial: "不行"
    formal: "不生效 / 无法正常工作"
    note: "\"配置不行\" → \"配置不生效\""

  # ── 程度/修饰 ──
  - colloquial: "好多"
    formal: "大量 / 许多"
    note: "\"好多报错\" → \"大量报错\""

  - colloquial: "很慢"
    formal: "响应延迟高 / 性能低下"
    note: "\"查询很慢\" → \"查询响应延迟高\""

  - colloquial: "很快"
    formal: "低延迟 / 高性能"
    note: "\"响应很快\" → \"低延迟响应\""

  - colloquial: "太大"
    formal: "超出限制 / 规模过大"
    note: "\"文件太大\" → \"文件大小超出限制\""

  # ── 疑问表达 ──
  - colloquial: "咋"
    formal: "如何 / 怎样"
    note: "\"咋配置\" → \"如何配置\""

  - colloquial: "咋样"
    formal: "怎么样 / 效果如何"
    note: "\"性能咋样\" → \"性能表现如何\""

  - colloquial: "啥"
    formal: "什么"
    note: "\"啥意思\" → \"什么意思 / 含义是什么\""

  - colloquial: "为啥"
    formal: "为什么 / 原因是什么"
    note: "\"为啥报错\" → \"为什么出现错误 / 报错原因是什么\""

  - colloquial: "咋整"
    formal: "如何处理 / 解决方案是什么"
    note: "\"这咋整\" → \"这如何处理\""

  - colloquial: "咋回事"
    formal: "原因是什么 / 发生了什么"
    note: "\"报错咋回事\" → \"报错原因是什么\""

  - colloquial: "有没有"
    formal: "是否存在 / 是否支持"
    note: "\"有没有这个功能\" → \"是否支持该功能\""

  - colloquial: "能不能"
    formal: "是否可以 / 是否支持"
    note: "\"能不能做到\" → \"是否可以实现\""

  - colloquial: "行不行"
    formal: "是否可行 / 是否有效"
    note: "\"这个方案行不行\" → \"这个方案是否可行\""

  # ── 指代/连接 ──
  - colloquial: "那个"
    formal: "[具体实体]"
    note: "上下文融合消解，替换为对话历史中的具体实体"

  - colloquial: "这个"
    formal: "[具体实体]"
    note: "上下文融合消解，替换为对话历史中的具体实体"

  # ── 常见错别字/网络用语修正 ──
  - colloquial: "有咩有"
    formal: "有没有"
    note: "常见输入错误"

  - colloquial: "神马"
    formal: "什么"
    note: "网络用语"

  - colloquial: "酱紫"
    formal: "这样"
    note: "网络用语"

  - colloquial: "表"
    formal: "不要"
    note: "仅在\"表+动词\"模式（如\"表用\"→\"不要用\"），不替换作为名词的\"表\""

# ═══════════════════════════════════════════════════════════════════════════════
# 二、按领域分类的专业术语对齐 (Domain Alignments)
# ═══════════════════════════════════════════════════════════════════════════════

domain_alignments:

