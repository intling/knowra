      note: ""

    - colloquial: "打个包"
      formal: "构建 / 打包"
      note: ""

    - colloquial: "拉代码"
      formal: "拉取代码 / git pull"
      note: ""

    - colloquial: "推代码"
      formal: "推送代码 / git push"
      note: ""

    - colloquial: "合代码"
      formal: "合并代码 / Merge"
      note: ""

    - colloquial: "rebase 一下"
      formal: "执行 git rebase"
