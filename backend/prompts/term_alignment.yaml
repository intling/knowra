      note: "\"一把\"为冗余语气词，去除"

    - colloquial: "上生产"
      formal: "部署到生产环境"
      note: ""

    - colloquial: "发版"
      formal: "发布版本 / Release"
      note: ""

    - colloquial: "回滚一下"
      formal: "回滚 / 版本回退"
      note: ""

    - colloquial: "加个锁"
