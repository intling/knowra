      formal: "安全漏洞"
      note: ""

    - colloquial: "被人打了"
      formal: "遭受攻击"
      note: ""

    - colloquial: "被黑了"
      formal: "被入侵 / 遭受安全攻击"
      note: ""

    - colloquial: "加密一下"
      formal: "加密"
