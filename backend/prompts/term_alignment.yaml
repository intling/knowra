    - colloquial: "搭集群"
      formal: "搭建集群"
      note: ""

    - colloquial: "扩容"
      formal: "水平扩展 / 扩容"
      note: "已是正式术语"

    - colloquial: "缩容"
      formal: "缩减规模 / 缩容"
      note: "已是正式术语"

