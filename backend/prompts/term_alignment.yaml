# ═══════════════════════════════════════════════════════════════════════════════
# 三、技术口语 → 标准术语映射 (Technical Colloquial → Standard)
# ═══════════════════════════════════════════════════════════════════════════════
# 开发者在日常交流中使用的非正式技术俚语 → 对应的标准技术术语。
# 此表侧重仅技术人员能理解的"行话"。

technical_alignments:
  - colloquial: "银弹"
    formal: "通用解决方案 / 万灵药"
    note: "Fred Brooks 的经典比喻"

  - colloquial: "语法糖"
    formal: "语法糖 / 便捷语法"
    note: "已是正式术语，但非技术人员可能不理解"

  - colloquial: "黑魔法"
    formal: "非常规技巧 / 底层技巧"
    note: "\"用了点黑魔法\" → \"使用了底层优化技巧\""

  - colloquial: "脏活"
    formal: "底层实现细节 / 繁琐的工作"
    note: "\"框架帮你干了脏活\" → \"框架封装了底层实现细节\""

  - colloquial: "八股文"
    formal: "面试常见题 / 标准问答"
    note: "程序员面试黑话"

  - colloquial: "造轮子"
    formal: "重复实现已有功能 / 重新开发"
    note: ""

  - colloquial: "不要重复造轮子"
    formal: "应优先使用现有解决方案而非重新开发"
    note: ""

  - colloquial: "祖传代码"
    formal: "遗留代码 / 历史遗留代码"
    note: ""

  - colloquial: "屎山"
    formal: "难以维护的遗留代码 / 技术债务"
    note: "贬义表达，正式化为\"技术债务\"或\"代码质量低下\""

  - colloquial: "胶水代码"
    formal: "集成代码 / 适配代码"
    note: ""

  - colloquial: "面条代码"
    formal: "结构混乱的代码 / 意大利面条式代码"
    note: ""

  - colloquial: "硬核"
    formal: "技术要求高 / 底层 / 难度大"
    note: "\"很硬核\" → \"技术难度高\""

  - colloquial: "氪金"
    formal: "付费使用 / 商业版"
    note: "\"这个功能要氪金\" → \"该功能需要付费使用\""

  - colloquial: "白嫖"
    formal: "免费使用 / 不付费"
    note: "\"能不能白嫖\" → \"是否有免费方案\""

  - colloquial: "摸鱼"
    formal: "[非技术表达，不替换]"
    note: "与技术查询无关，保持原样"

  - colloquial: "画饼"
    formal: "承诺 / 规划"
    note: "\"又在画饼\" → \"承诺的功能尚未实现\""

# ═══════════════════════════════════════════════════════════════════════════════
# 四、别名/俗称 → 标准写法 (Alias → Canonical)
# ═══════════════════════════════════════════════════════════════════════════════
# 多对一归并：将同一事物的多种俗称统一为标准写法。
# 注意：标准写法应与知识库中实际使用的名称一致。

alias_to_canonical:
  # ── 版本控制系统 ──
  - canonical: "GitHub"
    aliases: ["github", "gh", "GitHub.com"]

  - canonical: "GitLab"
    aliases: ["gitlab", "gl"]

  # ── 编程语言 ──
  - canonical: "JavaScript"
    aliases: ["js", "JS", "javascript"]

  - canonical: "TypeScript"
    aliases: ["ts", "TS", "typescript"]

