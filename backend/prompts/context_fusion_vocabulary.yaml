# ═══════════════════════════════════════════════════════════════════════════════
# 四、上下文消歧规则 (Context Disambiguation)
# ═══════════════════════════════════════════════════════════════════════════════
# 同一缩写/术语在不同上下文中可能有不同含义，此规则帮助根据对话历史消歧。

context_disambiguation:
  - ambiguous_term: "RAG"
    contexts:
      - context_keywords: ["检索", "知识库", "文档", "向量", "生成"]
        meaning: "Retrieval-Augmented Generation (检索增强生成)"
      - context_keywords: ["清理", "管道", "排水", "抹布"]
        meaning: "Rag (抹布/碎布，非技术含义)"

  - ambiguous_term: "模型"
    contexts:
      - context_keywords: ["AI", "LLM", "GPT", "训练", "推理", "参数"]
        meaning: "AI/ML 模型"
