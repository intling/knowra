# ============================================================================
# knowra — 上下文融合词汇表 (Context Fusion Vocabulary)
# ============================================================================
# 领域术语的上下文变体、同义表达、首字母缩写映射及领域关联。
#
# 用途：
#   1. 上下文融合阶段（ContextRewriter）——当查询含指代词时，借助此词汇表
#      将对话历史中的领域术语与当前查询中的模糊指代建立关联
#   2. 术语对齐阶段（TermAlignRewriter）——将用户口语化表达映射为正式术语
#   3. 质量评估阶段（Postprocessor）——检查改写结果中的关键领域术语留存率
#
# 词汇表结构：
#   - domain_terms:     领域核心术语（含正式名称、缩写、中文译名、上下文同义词）
#   - acronym_map:      缩写 ↔ 全称双向映射
#   - synonym_groups:   同义表达组（组内任意两两互为可替换的语义等价表达）
#   - context_disambiguation: 上下文消歧规则（同一缩写在不同上下文的不同含义）
#
# 版本规范：遵循 SemVer (MAJOR.MINOR.PATCH)
#   MAJOR — 文件结构/加载方式发生不兼容变更
#   MINOR — 新增术语域或大量术语
#   PATCH — 修正/补充个别术语
# ============================================================================

version: "1.0.0"
description: >-
  上下文融合词汇表 —— 为多轮对话中的指代消解提供领域术语的上下文变体、
  同义表达和缩写映射，帮助 LLM 在指代模糊时建立正确的术语关联。

