#   - acronyms:      首字母缩写列表
#   - chinese:       中文译名
#   - context_synonyms: 在不同上下文中的同义表达
#   - domain:        所属领域标签
#   - related:       关联术语
# ═══════════════════════════════════════════════════════════════════════════════

