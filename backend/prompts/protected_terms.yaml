# ============================================================================
# knowra — Protected Terms Catalog
# ============================================================================
# 精确词保护自定义词汇表 —— 包含不应被 LLM 翻译或替换的技术术语、专有名词
# 和代码标识符。
#
# 加载优先级 (高 → 低)：
#   1. 环境变量 QUERY_REWRITE_PROTECT_TERMS_CUSTOM_LIST（逗号分隔，紧急热修复）
#   2. 本文件（运维友好，支持非开发人员编辑，Git 追踪变更历史）
#   3. 内置正则规则（代码默认值，版本号/IP/URL/缩写/命名/邮件，零配置可用）
#
# 匹配优先级（保护阶段）：
#   词汇表匹配 > 正则规则匹配。词汇表匹配与正则匹配重叠时，以词汇表为准。
#
# 使用方式：
#   protector = TermProtector.from_defaults()     # 自动加载本文件
#   protector = TermProtector.from_vocab_file()   # 指定其他文件
#   protected, term_map = protector.protect("如何配置 Nginx 反向代理")
#   # protected: "如何配置 [[TERM_0]] [[TERM_1]]"
#   # term_map: {0: "Nginx", 1: "反向代理"}
#
# 版本规范：遵循 SemVer (MAJOR.MINOR.PATCH)
#   MAJOR — 文件结构/加载方式发生不兼容变更
#   MINOR — 新增术语分类或大量术语
#   PATCH — 修正/补充个别术语
# ============================================================================

